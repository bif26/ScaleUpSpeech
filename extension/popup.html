<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  body { font-family: -apple-system, 'Segoe UI', sans-serif; width: 280px; padding: 14px; margin: 0; }
  h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #888; }
  .dot.green { background: #3fb950; box-shadow: 0 0 6px #3fb950; }
  .dot.red { background: #f85149; box-shadow: 0 0 6px #f85149; }
  p { font-size: 12px; color: #555; margin: 8px 0; line-height: 1.4; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 10px 0; }
  .switch { position: relative; width: 44px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccc; border-radius: 999px; cursor: pointer; transition: background .2s; }
  .slider::before { content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform .2s; }
  input:checked + .slider { background: #5b7cfa; }
  input:checked + .slider::before { transform: translateX(22px); }
  .status-box { background: #f5f5f5; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #333; margin-top: 10px; font-family: ui-monospace, monospace; }
  a.btn { display: inline-block; margin-top: 10px; padding: 8px 12px; background: #5b7cfa; color: white; text-decoration: none; border-radius: 6px; font-size: 13px; }
</style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> LanguageShadow</h1>
  <div class="row">
    <span>Send YouTube captions</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="status-box" id="status">Checking local server…</div>
  <a class="btn" id="open-ui" href="#">Open LanguageShadow</a>

  <script src="popup.js"></script>
</body>
</html>
